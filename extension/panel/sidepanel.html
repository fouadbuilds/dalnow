<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DalNow</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <button id="backBtn" class="back-btn" type="button" hidden aria-label="Back to deadlines">← Back</button>
    <div class="brand">
      <img src="../icons/icon48.png" alt="" class="brand-icon" />
      <h1 id="panelTitle">DalNow</h1>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" type="button" title="Refresh now" aria-label="Refresh deadlines">&#8635;</button>
      <button id="settingsBtn" type="button" title="Settings" aria-label="Open settings">&#9881;</button>
    </div>
  </header>

  <div id="deadlineView">
    <div id="status" class="status"></div>
    <div id="summary" class="summary"></div>
    <div id="filters" class="filters" role="tablist" aria-label="Filter by course"></div>

    <main id="list"></main>
  </div>

  <section id="settingsView" class="settings-view" hidden aria-labelledby="panelTitle">
    <h2>Appearance</h2>
    <p class="settings-help">Choose how DalNow looks on this device.</p>
    <div class="theme-control" role="group" aria-label="Appearance preference">
      <button class="theme-option" type="button" data-theme-preference="system" aria-pressed="true">System</button>
      <button class="theme-option" type="button" data-theme-preference="light" aria-pressed="false">Light</button>
      <button class="theme-option" type="button" data-theme-preference="dark" aria-pressed="false">Dark</button>
    </div>
    <p id="themeDescription" class="settings-help" aria-live="polite"></p>

    <section class="data-section" aria-labelledby="dataHeading">
      <h2 id="dataHeading">My data</h2>
      <p class="settings-help">DalNow reads deadlines through the Learn session already open in this browser. It never asks for or stores your password.</p>
      <p class="settings-help">Your deadline list, settings, and checked or removed items stay only in this browser.</p>
      <button id="deleteDataBtn" class="delete-data-btn" type="button">Delete my data</button>
      <p id="dataStatus" class="settings-help" role="status"></p>
    </section>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
